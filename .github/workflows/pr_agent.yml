on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:

permissions:
  issues: write
  pull-requests: write

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: PR Agent action step
        uses: The-PR-Agent/pr-agent@v0.37.0
        env:
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG__MODEL: "openrouter/qwen/qwen3-coder:free"
          CONFIG__FALLBACK_MODELS: '["openrouter/meta-llama/llama-3.3-70b-instruct:free"]'
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "16000"
